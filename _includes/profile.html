{% assign profile = site.data.profile %}
<div class="profile">
  <div class="profile-bio">
    <p class="profile-name">{{ profile.name }}</p>
    {% capture bio %}{% include bio.md %}{% endcapture %}
    {{ bio | markdownify }}
    <p class="profile-links">
      <a href="mailto:{{ profile.email }}">Email</a> &nbsp;/&nbsp;
      <a href="{{ profile.github }}">Github</a>
    </p>
  </div>
  <div class="profile-photo">
    <img class="cover-photo" src="{{ profile.cover_photo | relative_url }}" alt="{{ profile.name }}">
  </div>
</div>
<p class="nav-tabs">
  <a href="{{ '/' | relative_url }}" class="{% if page.tab == 'projects' %}active{% endif %}">Projects</a>
  <a href="{{ '/experience.html' | relative_url }}" class="{% if page.tab == 'experience' %}active{% endif %}">Experience</a>
  <a href="{{ '/awards.html' | relative_url }}" class="{% if page.tab == 'awards' %}active{% endif %}">Awards</a>
  <a href="{{ '/personal.html' | relative_url }}" class="{% if page.tab == 'personal' %}active{% endif %}">Personal</a>
</p>
